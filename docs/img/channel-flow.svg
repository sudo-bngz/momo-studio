<svg viewBox="0 0 700 252" class="w-full" role="img" aria-label="One in-line console channel: mic and line inputs through the preamp, insert, EQ and fader, leaving by the direct out, a group, the mix or an aux; and the tape return on its own monitor path."><defs><marker id="sf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5 L8 4 L0 7.5 z" fill="#3a3e45"></path></marker><marker id="sf-arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5 L8 4 L0 7.5 z" fill="#f2a541"></path></marker><marker id="sf-arrow-info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5 L8 4 L0 7.5 z" fill="#7dd3fc"></path></marker></defs><text x="6" y="16" font-size="9" fill="#6b6e76" letter-spacing="0.6">CHANNEL PATH</text><g><rect x="6" y="33" width="66" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="39" y="46" text-anchor="middle" font-size="11" fill="#ecebe7">Mic</text><text x="39" y="59" text-anchor="middle" font-size="8.5" fill="#6b6e76">XLR</text></g><g><rect x="6" y="89" width="66" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="39" y="102" text-anchor="middle" font-size="11" fill="#ecebe7">Line</text><text x="39" y="115" text-anchor="middle" font-size="8.5" fill="#6b6e76">jack</text></g><path d="M72 48 H84 V76" fill="none" stroke="#3a3e45"></path><path d="M72 104 H84 V76" fill="none" stroke="#3a3e45"></path><path d="M84 76 H96" fill="none" stroke="#3a3e45" marker-end="url(#sf-arrow)"></path><g><rect x="96" y="61" width="72" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="132" y="80" text-anchor="middle" font-size="11" fill="#ecebe7">Preamp</text></g><path d="M168 76 H192" fill="none" stroke="#3a3e45" marker-end="url(#sf-arrow)"></path><g><rect x="192" y="61" width="72" height="30" rx="4" fill="#202226" stroke="#7dd3fc" stroke-width="1"></rect><text x="228" y="74" text-anchor="middle" font-size="11" fill="#7dd3fc">Insert</text><text x="228" y="87" text-anchor="middle" font-size="8.5" fill="#6b6e76">pre-EQ</text></g><path d="M264 76 H288" fill="none" stroke="#3a3e45" marker-end="url(#sf-arrow)"></path><g><rect x="288" y="61" width="52" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="314" y="80" text-anchor="middle" font-size="11" fill="#ecebe7">EQ</text></g><path d="M340 76 H364" fill="none" stroke="#3a3e45" marker-end="url(#sf-arrow)"></path><g><rect x="364" y="61" width="52" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="390" y="80" text-anchor="middle" font-size="11" fill="#ecebe7">Fader</text></g><path d="M210 91 V120" fill="none" stroke="#7dd3fc" stroke-dasharray="3 3" marker-end="url(#sf-arrow-info)"></path><path d="M246 120 V91" fill="none" stroke="#7dd3fc" stroke-dasharray="3 3" marker-end="url(#sf-arrow-info)"></path><text x="204" y="107" text-anchor="end" font-size="8" fill="#7dd3fc">tip</text><text x="252" y="107" font-size="8" fill="#7dd3fc">ring</text><g><rect x="180" y="120" width="96" height="30" rx="4" fill="#202226" stroke="#7dd3fc" stroke-width="1"></rect><text x="228" y="133" text-anchor="middle" font-size="11" fill="#7dd3fc">Outboard</text><text x="228" y="146" text-anchor="middle" font-size="8.5" fill="#6b6e76">comp, EQ, pedal</text></g><path d="M416 76 H441" fill="none" stroke="#f2a541"></path><path d="M441 20 V152" fill="none" stroke="#f2a541"></path><g><path d="M441 20 H466" fill="none" stroke="#f2a541" marker-end="url(#sf-arrow-amber)"></path><g><rect x="466" y="3" width="200" height="34" rx="4" fill="#202226" stroke="#f2a541" stroke-width="1"></rect><text x="566" y="18" text-anchor="middle" font-size="11" fill="#f2a541">Direct out</text><text x="566" y="31" text-anchor="middle" font-size="8.5" fill="#6b6e76">→ Ch n Track Out</text></g></g><g><path d="M441 64 H466" fill="none" stroke="#f2a541" marker-end="url(#sf-arrow-amber)"></path><g><rect x="466" y="47" width="200" height="34" rx="4" fill="#202226" stroke="#f2a541" stroke-width="1"></rect><text x="566" y="62" text-anchor="middle" font-size="11" fill="#f2a541">Group 1–8</text><text x="566" y="75" text-anchor="middle" font-size="8.5" fill="#6b6e76">→ track outs of channels g, g+8, g+16</text></g></g><g><path d="M441 108 H466" fill="none" stroke="#f2a541" marker-end="url(#sf-arrow-amber)"></path><g><rect x="466" y="91" width="200" height="34" rx="4" fill="#202226" stroke="#f2a541" stroke-width="1"></rect><text x="566" y="106" text-anchor="middle" font-size="11" fill="#f2a541">Mix L/R</text><text x="566" y="119" text-anchor="middle" font-size="8.5" fill="#6b6e76">→ Mix Out L / Mix Out R</text></g></g><g><path d="M441 152 H466" fill="none" stroke="#f2a541" marker-end="url(#sf-arrow-amber)"></path><g><rect x="466" y="135" width="200" height="34" rx="4" fill="#202226" stroke="#f2a541" stroke-width="1"></rect><text x="566" y="150" text-anchor="middle" font-size="11" fill="#f2a541">Aux 1–4</text><text x="566" y="163" text-anchor="middle" font-size="8.5" fill="#6b6e76">post-fade → Aux n Out</text></g></g><text x="6" y="205" font-size="9" fill="#6b6e76" letter-spacing="0.6">MONITOR PATH</text><g><rect x="6" y="213" width="66" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="39" y="226" text-anchor="middle" font-size="11" fill="#ecebe7">Tape In</text><text x="39" y="239" text-anchor="middle" font-size="8.5" fill="#6b6e76">track return</text></g><path d="M72 228 H96" fill="none" stroke="#3a3e45" marker-end="url(#sf-arrow)"></path><g><rect x="96" y="213" width="96" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="144" y="232" text-anchor="middle" font-size="11" fill="#ecebe7">Monitor level</text></g><path d="M192 228 H216" fill="none" stroke="#3a3e45" marker-end="url(#sf-arrow)"></path><g><rect x="216" y="213" width="120" height="30" rx="4" fill="#202226" stroke="#3a3e45" stroke-width="1"></rect><text x="276" y="232" text-anchor="middle" font-size="11" fill="#ecebe7">Cue / monitors</text></g><text x="350" y="232" font-size="9" fill="#6b6e76">Auxes 3 and 4 can be switched to follow this path instead.</text></svg>